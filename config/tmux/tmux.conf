# ╔══════════════════════════════════════════════════════════════╗
# ║  Zenith Tmux — Ghost Dashboard                              ║
# ║                                                             ║
# ║  No pills. No shapes. No borders.                           ║
# ║  Just dim text that fades into the background.              ║
# ║  Look and it's there. Code and it's gone.                   ║
# ╚══════════════════════════════════════════════════════════════╝

# ==========================
# TERMINAL & COLOR
# ==========================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# Explicit user keys for Alacritty's Ctrl+Tab / Ctrl+Shift+Tab sequences.
# F13/F14 are not valid binding names on all supported tmux versions.
set -s user-keys[0] "\e[25~"
set -s user-keys[1] "\e[26~"

# ==========================
# PREFIX
# ==========================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ==========================
# GENERAL
# ==========================
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g status-position bottom
set -g status-interval 3
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "  Config Reloaded"

# ==========================
# KEY BINDINGS
# ==========================

# Alacritty sends these standard tmux keys. Resolve the focused pane's path
# when the shortcut is pressed, including after the shell changes directory.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Cmd+Shift+T: prompt for a name, then open the session in the focused pane's path.
bind T command-prompt -F -p "new session name:" 'new-session -s "%%%" -c #{q:pane_current_path}'

# Keep the existing prefix aliases.
bind D split-window -v -c "#{pane_current_path}"
bind d split-window -h -c "#{pane_current_path}"
bind y new-window -c "#{pane_current_path}"

# Match Alacritty mappings
# Smart w: in __scratch__ → if focused pane is borrowed, send it home; otherwise kill normally
bind w if-shell '[ "#{window_name}" = "__scratch__" ]' \
    'run-shell "~/.config/tmux/scratch_return_one.sh \"#{pane_id}\""' \
    'kill-pane'
# Smart W: in __scratch__ → return all borrowed panes home and tear down the scratch window
bind W if-shell '[ "#{window_name}" = "__scratch__" ]' \
    'run-shell "~/.config/tmux/scratch_return.sh"' \
    'kill-window'
bind p choose-tree -Zw
bind P choose-tree -Zs
bind o display-panes
bind R command-prompt -I "#W" "rename-window '%%'"
bind N previous-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle panes: Ctrl+Tab / Ctrl+Shift+Tab
# (Mapped via Alacritty to User0/User1 without a prefix)
bind-key -n User0 select-pane -t :.+
bind-key -n User1 select-pane -t :.-

# Previous window, including cross-session navigation; history belongs to each client.
bind a run-shell "~/.config/tmux/swap_last_window.sh '#{client_name}' '#{client_pid}' '#{session_id}'"
set-hook -g client-attached[20] 'run-shell "~/.config/tmux/swap_last_window.sh seed #{client_pid} #{q:session_id}:#{window_id}"'
set-hook -g client-session-changed[20] 'run-shell "~/.config/tmux/swap_last_window.sh track #{client_pid}"'
set-hook -g session-window-changed[20] 'run-shell "~/.config/tmux/swap_last_window.sh track"'

# Auto-Resize Mode (Prefix + A)
# Automatically zooms small panes when focused. When leaving to a larger pane, it unzooms.
bind A if-shell -F '#{@auto_resize}' \
    'set-option -g @auto_resize 0 ; set-hook -ug pane-focus-in ; set-hook -ug pane-focus-out ; display-message "  Auto Zoom: OFF"' \
    'set-option -g @auto_resize 1 ; set-hook -g pane-focus-out "run-shell \"~/.config/tmux/auto_resize.sh out #{pane_id}\"" ; set-hook -g pane-focus-in "run-shell \"~/.config/tmux/auto_resize.sh in #{pane_id}\"" ; display-message "  Auto Zoom: ON"'

# ==========================
# PANE DRAG-SWAP — Option+drag to rearrange panes
# ==========================
# Hold Option (Alt) and drag from one pane to another to swap their
# positions. Plain drag is left alone so copy-mode text selection still
# works. MouseDown1Pane fires on click → focuses source pane so the user
# sees what they're about to move; MouseDrag1Pane is bound (no-op) so
# tmux registers the drag and fires the end event reliably.
# NOTE: -t '#{pane_id}' does NOT format-substitute (tmux treats target as a
# literal string), which spams "can't find pane #{pane_id}" on every drag
# tick. Use `-t =` — the mouse-event target alias that resolves to the pane
# the click/drag started in. run-shell DOES substitute formats in its
# shell-command argument, so the script call below is fine.
bind -n M-MouseDown1Pane    select-pane -t =
bind -n M-MouseDrag1Pane    select-pane -t =
bind -n M-MouseDragEnd1Pane run-shell -b "~/.config/tmux/pane_drag_swap.sh '#{pane_id}'"

# ==========================
# PANE BORDERS
# ==========================
# Color psychology: blue = focus / calm productivity. Active pane glows blue
# so the eye is drawn there; inactive panes recede into the dim surface gray.
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89B4FA,bold"

# ==========================
# COPY MODE — Vim-Style Selection
# ==========================
set-window-option -g mode-keys vi

# Prefix + v: Enter copy-mode (mnemonic: vim)
bind v copy-mode

# Vi-style selection bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# Yank to clipboard + show preview popup (press q to close)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.config/tmux/yank_preview.sh'

# Mouse drag → silent copy to clipboard (no popup)
if-shell "uname | grep -q Darwin" \
    "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# ==========================
# LOG GRABBER (Prefix + g)
# ==========================
# Opens fzf popup over scrollback — multi-select lines, copies to clipboard
bind g display-popup -E -w 80% -h 90% "~/.config/tmux/log_grabber.sh"

# ==========================
# STATUS BAR — Ghost Dashboard
# ==========================
# Everything is dim gray (#585B70 / #6C7086) on the same
# background. No boxes. No pills. No shapes. Just text.
# The only exception: active window gets a gentle nudge of color.

set -g status-style "bg=#11111B,fg=#585B70"

# ── Left: Session name ──
set -g status-left-length 50
set -g status-left "#{?client_prefix,#[fg=#fab387 bold]  COMMAND ,#[fg=#6C7086]  #S }  "

# ── Center: Window Tabs ──
# Inactive: ghost gray — same as status bar, nearly invisible
set -g window-status-format "#[fg=#45475A]  #I·#W "

# Active: just slightly brighter — a gentle whisper, not a shout
# Scratch view gets a peach badge so you remember borrowed panes are pending return
set -g window-status-current-format "#{?#{==:#W,__scratch__},#[fg=#fab387 bold]   SCRATCH ,#[fg=#BAC2DE bold]  #I·#W }"

set -g window-status-separator ""

# ── Right: System Info — all dim, same gray family ──
set -g status-right-length 80
set -g status-right "#[fg=#585B70]  #{cpu_percentage}   #{ram_percentage}  #(df -h / | awk 'NR==2{print $5}')  #{battery_icon} #{battery_percentage}    %H:%M  "

# Message & Mode
set -g message-style "fg=#F9E2AF,bg=#11111B,bold"
set -g message-command-style "fg=#94E2D5,bg=#11111B"
set -g mode-style "fg=#11111B,bg=#B4BEFE"

# ==========================
# PLUGINS
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
# Continuum must load after plugins that rewrite the status bar.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Termi restores synchronously once, before enabling automatic checkpoints.
set -g @continuum-restore 'off'
# Pause scheduling while TPM refreshes its raw script paths.
set -g @continuum-save-interval '0'
set -g @resurrect-capture-pane-contents 'on'

set -g @cpu_percentage_format "%2.0f%%"
set -g @ram_percentage_format "%2.0f%%"

set -g @batt_icon_charge_tier8 ''
set -g @batt_icon_charge_tier7 ''
set -g @batt_icon_charge_tier6 ''
set -g @batt_icon_charge_tier5 ''
set -g @batt_icon_charge_tier4 ''
set -g @batt_icon_charge_tier3 ''
set -g @batt_icon_charge_tier2 ''
set -g @batt_icon_charge_tier1 ''
set -g @batt_icon_status_charged ''
set -g @batt_icon_status_charging ''

# Google Search (Prefix + G) -> Opens in default browser
# MacOS: open, Linux: xdg-open
if-shell "uname | grep -q Darwin" \
    "bind-key G command-prompt -p '🔍 Google:' \"run-shell 'open \\\"https://www.google.com/search?q=%1\\\"'\"" \
    "bind-key G command-prompt -p '🔍 Google:' \"run-shell 'xdg-open \\\"https://www.google.com/search?q=%1\\\"'\""

# ==========================
# FIND & KILL PROCESS (Cmd+Shift+F)
# ==========================
bind F display-popup -E -w 90% -h 90% "bash ~/.config/tmux/find_process_fzf.sh"

# ==========================
# WINDOW FINDER (Cmd+P style)
# ==========================
# Prefix + f (Cmd+I from Alacritty): fuzzy window picker with live preview
bind f display-popup -E -w 95% -h 90% "~/.config/tmux/window_finder.sh"

# Prefix + s (Cmd+P from Alacritty): fuzzy session picker with full session
# preview (every window + every pane). Replaces tmux's default choose-tree -s.
bind s display-popup -E -w 95% -h 90% "~/.config/tmux/session_finder.sh"

# ==========================
# COMMAND PALETTE (Raycast / Cmd+K style)
# ==========================
# Prefix + / : Type-to-search list of every feature, with shortcuts shown.
# Also bound from Alacritty as Cmd+/ (mac) / Alt+/ (linux) for prefix-free access.
bind / display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
    "~/.config/tmux/command_palette.sh '#{pane_id}'"

# ==========================
# SCRATCH VIEW — Multi-window side-by-side
# ==========================
# Prefix + b : borrow a pane from another window into a temporary __scratch__
#              workspace alongside your current pane. Press again to add more.
# Prefix + B : send all borrowed panes back home and tear down the scratch.
bind b display-popup -E -w 95% -h 90% \
    "~/.config/tmux/scratch_borrow.sh '#{pane_id}' '#{session_name}' '#{window_id}' '#{window_name}'"
bind B run-shell "~/.config/tmux/scratch_return.sh"

# Safety net: if __scratch__ is destroyed by ANY means (choose-tree x,
# :kill-window, last pane killed, server restart) — clean up orphan
# placeholders and stale state so the next session starts clean.
set-hook -g window-unlinked "run-shell '~/.config/tmux/scratch_cleanup.sh'"

# ==========================
# POPUP TERMINAL (Modal)
# ==========================
# Prefix + P: Opens a floating popup window (80% width/height)
# You can run any command here (git, htop, quick edits).
# Press Ctrl+D or type 'exit' to close it.
bind P display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "zsh"

# ==========================
# ZOOM / FOCUS
# ==========================
# Prefix+z → zoom toggle for the invoking client
bind z resize-pane -Z
# Cmd+Z (via Alacritty → Prefix+z) → same zoom toggle
# Ensure Escape is never intercepted (needed for zsh vi-mode)
unbind -T root Escape

# Focus belongs to the actual client, not a hook's command target session.
set-hook -g client-focus-in[30] 'run-shell "~/.config/tmux/swap_last_window.sh track #{client_pid}"'

# Event saves coalesce for one second and share a lock with periodic/manual saves.
set-hook -g after-new-window[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g after-split-window[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g after-resize-pane[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g after-select-layout[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g window-unlinked[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g after-kill-pane[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g after-new-session[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g session-closed[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g session-renamed[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g after-rename-window[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g pane-exited[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py event" }'
set-hook -g client-detached[30] 'if-shell -F "#{==:#{@termi-session-ready},1}" { run-shell -b "python3 ~/.config/tmux/session_state.py detach" }'

# new-session and attach-session have different hooks; cover both startup paths.
set-hook -g after-new-session[40] 'if-shell -F "#{||:#{==:#{@termi-session-ready},},#{==:#{@termi-restore-pending},1}}" { run-shell "python3 ~/.config/tmux/session_state.py attach" }'
set-hook -g client-attached[40] 'if-shell -F "#{||:#{==:#{@termi-session-ready},},#{==:#{@termi-restore-pending},1}}" { run-shell "python3 ~/.config/tmux/session_state.py attach" }'

# TPM exports the resurrect script paths; Termi wraps them after plugin loading.
run '~/.tmux/plugins/tpm/tpm'
run-shell 'python3 ~/.config/tmux/session_state.py init'
set -g @continuum-save-interval '1'
bind C-s run-shell -b 'python3 ~/.config/tmux/session_state.py save'
bind C-r run-shell 'python3 ~/.config/tmux/session_state.py restore'
