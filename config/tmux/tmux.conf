# ╔══════════════════════════════════════════════════════════════╗
# ║  Zenith Tmux — Ghost Dashboard                              ║
# ║                                                             ║
# ║  No pills. No shapes. No borders.                           ║
# ║  Just dim text that fades into the background.              ║
# ║  Look and it's there. Code and it's gone.                   ║
# ╚══════════════════════════════════════════════════════════════╝

# ==========================
# TERMINAL & COLOR
# ==========================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# Teach tmux the F13/F14 sequences sent by Alacritty (Ctrl+Tab / Ctrl+Shift+Tab)
# xterm-256color terminfo doesn't define these, so without this tmux warns "unknown key"
set -as terminal-overrides ',xterm-256color:kf13=\E[25~:kf14=\E[26~'

# ==========================
# PREFIX
# ==========================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ==========================
# GENERAL
# ==========================
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g status-position bottom
set -g status-interval 3
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "  Config Reloaded"

# ==========================
# KEY BINDINGS
# ==========================
bind D split-window -v -c "#{pane_current_path}"
bind d split-window -h -c "#{pane_current_path}"
bind y new-window -c "#{pane_current_path}"

# Match Alacritty mappings
# Smart w: in __scratch__ → if focused pane is borrowed, send it home; otherwise kill normally
bind w if-shell '[ "#{window_name}" = "__scratch__" ]' \
    'run-shell "~/.config/tmux/scratch_return_one.sh \"#{pane_id}\""' \
    'kill-pane'
# Smart W: in __scratch__ → return all borrowed panes home and tear down the scratch window
bind W if-shell '[ "#{window_name}" = "__scratch__" ]' \
    'run-shell "~/.config/tmux/scratch_return.sh"' \
    'kill-window'
bind p choose-tree -Zw
bind P choose-tree -Zs
bind o display-panes
bind R command-prompt -I "#W" "rename-window '%%'"
bind N previous-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Cycle panes: Ctrl+Tab / Ctrl+Shift+Tab
# (Mapped via Alacritty to F13/F14 for prefix-free switching without breaking autocomplete)
bind-key -n F13 select-pane -t :.+
bind-key -n F14 select-pane -t :.-

# Auto-Resize Mode (Prefix + a)
# Automatically zooms small panes when focused. When leaving to a larger pane, it unzooms.
bind a if-shell -F '#{@auto_resize}' \
    'set-option -g @auto_resize 0 ; set-hook -ug pane-focus-in ; set-hook -ug pane-focus-out ; display-message "  Auto Zoom: OFF"' \
    'set-option -g @auto_resize 1 ; set-hook -g pane-focus-out "run-shell \"~/.config/tmux/auto_resize.sh out\"" ; set-hook -g pane-focus-in "run-shell \"~/.config/tmux/auto_resize.sh in\"" ; display-message "  Auto Zoom: ON"'

# ==========================
# PANE BORDERS
# ==========================
# Color psychology: blue = focus / calm productivity. Active pane glows blue
# so the eye is drawn there; inactive panes recede into the dim surface gray.
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89B4FA,bold"

# ==========================
# COPY MODE — Vim-Style Selection
# ==========================
set-window-option -g mode-keys vi

# Prefix + v: Enter copy-mode (mnemonic: vim)
bind v copy-mode

# Vi-style selection bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# Yank to clipboard + show preview popup (press q to close)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.config/tmux/yank_preview.sh'

# Mouse drag → silent copy to clipboard (no popup)
if-shell "uname | grep -q Darwin" \
    "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# ==========================
# LOG GRABBER (Prefix + g)
# ==========================
# Opens fzf popup over scrollback — multi-select lines, copies to clipboard
bind g display-popup -E -w 80% -h 90% "~/.config/tmux/log_grabber.sh"

# ==========================
# STATUS BAR — Ghost Dashboard
# ==========================
# Everything is dim gray (#585B70 / #6C7086) on the same
# background. No boxes. No pills. No shapes. Just text.
# The only exception: active window gets a gentle nudge of color.

set -g status-style "bg=#11111B,fg=#585B70"

# ── Left: Session name ──
set -g status-left-length 50
set -g status-left "#{?client_prefix,#[fg=#fab387 bold]  COMMAND ,#[fg=#6C7086]  #S }  "

# ── Center: Window Tabs ──
# Inactive: ghost gray — same as status bar, nearly invisible
set -g window-status-format "#[fg=#45475A]  #I·#W "

# Active: just slightly brighter — a gentle whisper, not a shout
# Scratch view gets a peach badge so you remember borrowed panes are pending return
set -g window-status-current-format "#{?#{==:#W,__scratch__},#[fg=#fab387 bold]   SCRATCH ,#[fg=#BAC2DE bold]  #I·#W }"

set -g window-status-separator ""

# ── Right: System Info — all dim, same gray family ──
set -g status-right-length 80
set -g status-right "#[fg=#585B70]  #{cpu_percentage}   #{ram_percentage}  #(df -h / | awk 'NR==2{print $5}')  #{battery_icon} #{battery_percentage}    %H:%M  "

# Message & Mode
set -g message-style "fg=#F9E2AF,bg=#11111B,bold"
set -g message-command-style "fg=#94E2D5,bg=#11111B"
set -g mode-style "fg=#11111B,bg=#B4BEFE"

# ==========================
# PLUGINS
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'

set -g @cpu_percentage_format "%2.0f%%"
set -g @ram_percentage_format "%2.0f%%"

set -g @batt_icon_charge_tier8 ''
set -g @batt_icon_charge_tier7 ''
set -g @batt_icon_charge_tier6 ''
set -g @batt_icon_charge_tier5 ''
set -g @batt_icon_charge_tier4 ''
set -g @batt_icon_charge_tier3 ''
set -g @batt_icon_charge_tier2 ''
set -g @batt_icon_charge_tier1 ''
set -g @batt_icon_status_charged ''
set -g @batt_icon_status_charging ''

# Google Search (Prefix + G) -> Opens in default browser
# MacOS: open, Linux: xdg-open
if-shell "uname | grep -q Darwin" \
    "bind-key G command-prompt -p '🔍 Google:' \"run-shell 'open \\\"https://www.google.com/search?q=%1\\\"'\"" \
    "bind-key G command-prompt -p '🔍 Google:' \"run-shell 'xdg-open \\\"https://www.google.com/search?q=%1\\\"'\""

# ==========================
# WINDOW FINDER (Cmd+P style)
# ==========================
# Prefix + f (Cmd+I from Alacritty): fuzzy window picker with live preview
bind f display-popup -E -w 95% -h 90% "~/.config/tmux/window_finder.sh"

# Prefix + s (Cmd+P from Alacritty): fuzzy session picker with full session
# preview (every window + every pane). Replaces tmux's default choose-tree -s.
bind s display-popup -E -w 95% -h 90% "~/.config/tmux/session_finder.sh"

# ==========================
# COMMAND PALETTE (Raycast / Cmd+K style)
# ==========================
# Prefix + / : Type-to-search list of every feature, with shortcuts shown.
# Also bound from Alacritty as Cmd+/ (mac) / Alt+/ (linux) for prefix-free access.
bind / display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
    "~/.config/tmux/command_palette.sh '#{pane_id}'"

# ==========================
# SCRATCH VIEW — Multi-window side-by-side
# ==========================
# Prefix + b : borrow a pane from another window into a temporary __scratch__
#              workspace alongside your current pane. Press again to add more.
# Prefix + B : send all borrowed panes back home and tear down the scratch.
bind b display-popup -E -w 95% -h 90% \
    "~/.config/tmux/scratch_borrow.sh '#{pane_id}' '#{session_name}' '#{window_id}' '#{window_name}'"
bind B run-shell "~/.config/tmux/scratch_return.sh"

# Safety net: if __scratch__ is destroyed by ANY means (choose-tree x,
# :kill-window, last pane killed, server restart) — clean up orphan
# placeholders and stale state so the next session starts clean.
set-hook -g window-unlinked "run-shell '~/.config/tmux/scratch_cleanup.sh'"

# ==========================
# POPUP TERMINAL (Modal)
# ==========================
# Prefix + P: Opens a floating popup window (80% width/height)
# You can run any command here (git, htop, quick edits).
# Press Ctrl+D or type 'exit' to close it.
bind P display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "zsh"

# ==========================
# ZOOM / FOCUS
# ==========================
# Prefix+z → zoom toggle (built-in)
# Cmd+Z (via Alacritty → Prefix+z) → same zoom toggle
# Ensure Escape is never intercepted (needed for zsh vi-mode)
unbind -T root Escape

# Init TPM (MUST be last line)
run '~/.tmux/plugins/tpm/tpm'